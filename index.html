<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tri des messages agricoles</title>
  <style>
    :root {
      --fond: #f7f7f4;
      --carte: #ffffff;
      --texte: #1c1c1c;
      --texte-doux: #5b5b5b;
      --bordure: #d9d9d2;
      --vert: #2f6b3a;
      --rouge: #b3261e;
      --rouge-fond: #fdecea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.5;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 2rem;
      color: var(--vert);
    }

    .sous-titre {
      margin: 0 0 28px;
      color: var(--texte-doux);
    }

    /* Compteurs */
    .compteurs {
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .compteur {
      flex: 1 1 220px;
      background: var(--carte);
      border: 1px solid var(--bordure);
      border-radius: 10px;
      padding: 18px 24px;
    }

    .compteur .valeur {
      display: block;
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .compteur .libelle {
      color: var(--texte-doux);
      font-size: 1.05rem;
    }

    .compteur.urgent {
      border-color: var(--rouge);
      background: var(--rouge-fond);
    }

    .compteur.urgent .valeur { color: var(--rouge); }

    /* Tableau */
    .tableau-conteneur {
      overflow-x: auto;
      background: var(--carte);
      border: 1px solid var(--bordure);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      vertical-align: top;
      padding: 14px 16px;
      border-bottom: 1px solid var(--bordure);
    }

    th {
      background: var(--vert);
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: none; }

    tr.urgent td { background: var(--rouge-fond); }
    tr.urgent td:first-child { box-shadow: inset 6px 0 0 var(--rouge); }

    td.date { white-space: nowrap; }
    td.message { min-width: 320px; }

    .vide {
      color: var(--texte-doux);
      font-style: italic;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .badge.elevee { background: var(--rouge); color: #fff; }
    .badge.normale { background: #e6e6e0; color: var(--texte); }
  </style>
</head>
<body>
  <main>
    <h1>Tri des messages agricoles</h1>
    <p class="sous-titre">Fiches produites par l'assistant IA à partir des messages d'agriculteurs</p>

    <section class="compteurs">
      <div class="compteur">
        <span class="valeur" id="nb-total">0</span>
        <span class="libelle">fiches au total</span>
      </div>
      <div class="compteur urgent">
        <span class="valeur" id="nb-urgents">0</span>
        <span class="libelle">cas urgents</span>
      </div>
    </section>

    <div class="tableau-conteneur">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Message de l'agriculteur</th>
            <th>Culture</th>
            <th>Problème</th>
            <th>Urgence</th>
          </tr>
        </thead>
        <tbody id="corps-tableau"></tbody>
      </table>
    </div>
  </main>

  <!-- Les données : définit la constante FICHES -->
  <script src="fiches.js"></script>

  <script>
    // Trie les fiches : urgentes d'abord, puis les plus récentes en premier.
    function trierFiches(fiches) {
      return fiches.slice().sort(function (a, b) {
        const urgenceA = a.fiche.urgence === "elevee" ? 0 : 1;
        const urgenceB = b.fiche.urgence === "elevee" ? 0 : 1;
        if (urgenceA !== urgenceB) return urgenceA - urgenceB;
        return b.date.localeCompare(a.date);
      });
    }

    // Formate une date "2026-11-02" en "02/11/2026".
    function formaterDate(dateIso) {
      const morceaux = dateIso.split("-");
      return morceaux[2] + "/" + morceaux[1] + "/" + morceaux[0];
    }

    // Crée une cellule de tableau ; affiche "non précisé" si la valeur est null.
    function creerCellule(valeur, classe) {
      const td = document.createElement("td");
      if (classe) td.className = classe;
      if (valeur === null) {
        td.textContent = "non précisé";
        td.classList.add("vide");
      } else {
        td.textContent = valeur;
      }
      return td;
    }

    // Affiche les compteurs et le tableau pour la liste de fiches donnée.
    function afficher(fiches) {
      const urgentes = fiches.filter(function (f) { return f.fiche.urgence === "elevee"; });
      document.getElementById("nb-total").textContent = fiches.length;
      document.getElementById("nb-urgents").textContent = urgentes.length;

      const corps = document.getElementById("corps-tableau");
      corps.innerHTML = "";

      trierFiches(fiches).forEach(function (f) {
        const tr = document.createElement("tr");
        if (f.fiche.urgence === "elevee") tr.className = "urgent";

        tr.appendChild(creerCellule(formaterDate(f.date), "date"));
        tr.appendChild(creerCellule(f.message, "message"));
        tr.appendChild(creerCellule(f.fiche.culture));
        tr.appendChild(creerCellule(f.fiche.probleme));

        const tdUrgence = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = "badge " + f.fiche.urgence;
        badge.textContent = f.fiche.urgence === "elevee" ? "Élevée" : "Normale";
        tdUrgence.appendChild(badge);
        tr.appendChild(tdUrgence);

        corps.appendChild(tr);
      });
    }

    afficher(FICHES);
  </script>
</body>
</html>
